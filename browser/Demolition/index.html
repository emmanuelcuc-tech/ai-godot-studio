<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Demolition — Browser Demo</title>
<style>
  html, body { margin:0; height:100%; background:#161a22; overflow:hidden; font-family:-apple-system,system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:absolute; left:12px; top:10px; color:#e8eef8; text-shadow:0 1px 2px #000; pointer-events:none; font-size:14px; }
  #msg { position:absolute; left:50%; top:12px; transform:translateX(-50%); color:#ffe8c0; pointer-events:none; font-weight:600; }
  #btns { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:8px; }
  button { min-width:120px; padding:14px 16px; border:0; border-radius:10px; background:#2d3548; color:#eee; font-weight:700; font-size:16px; }
  #hint { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); color:#889; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>
<div id="btns">
  <button id="next" type="button">NEXT</button>
  <button id="reset" type="button">RESET</button>
</div>
<div id="hint">Drag ball back · release to fling · Codea Demolition demo</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");
  const msgEl = document.getElementById("msg");
  let W=0,H=0, floorY=70;
  const BLOCK=34, BALL_R=20, WIN=0.62;
  const LEVELS = [
    { name:"Starter Shed", shots:3, map:[".BBBB.",".BWWB.",".BWWB.",".BBBB."] },
    { name:"Brick Stack", shots:4, map:["..BBBB..",".BBBBBB.",".BBBBBB.",".BBCCBB.",".BBBBBB."] },
    { name:"Glass Office", shots:4, map:[".CCCCCCC.",".CGGGGGC.",".CGGGGGC.",".CWWWWWC.",".CCCCCCC.",".CCCCCCC."] },
    { name:"Steel Spine", shots:5, map:["..BBBBB..",".BBSBSBB.",".BBSSSSB.",".BBSBSBB.",".BBBBBBB.",".WWCCCWW."] },
    { name:"Highrise Razing", shots:5, map:["...GGG...","..CGGGC..",".CCSSSCC.",".CBBBBBC.",".CGGGGGC.",".CSSSSSC.",".CBBBBBC.",".CCCCCCC.",".WWWWWWW."] },
  ];
  const KIND = {
    B:{dens:1.2, col:[190,85,55], pts:55},
    C:{dens:1.6, col:[160,165,175], pts:40},
    G:{dens:0.55, col:[140,210,230], pts:80},
    S:{dens:2.4, col:[120,130,145], pts:30},
    W:{dens:0.7, col:[150,105,55], pts:45},
  };

  let level=0, shots=0, score=0, state="aim", message="", messageT=0;
  let blocks=[], ball=null, particles=[];
  let drag=null, settle=0, initial=0;

  function resize(){
    const dpr=Math.min(2, devicePixelRatio||1);
    W=canvas.clientWidth; H=canvas.clientHeight;
    canvas.width=(W*dpr)|0; canvas.height=(H*dpr)|0;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", resize);

  function start(i){
    level=Math.max(0, Math.min(LEVELS.length-1, i));
    const L=LEVELS[level];
    shots=L.shots; score=0; state="aim"; message=L.name; messageT=2.2;
    blocks=[]; particles=[]; drag=null; settle=0;
    const map=L.map, rows=map.length, cols=map[0].length;
    const baseX=W*0.62, baseY=floorY+BLOCK*0.5+2;
    for(let r=rows-1;r>=0;r--){
      const rowFromBottom=rows-1-r;
      for(let c=0;c<cols;c++){
        const ch=map[r][c];
        if(ch==="."||ch===" ") continue;
        const k=KIND[ch]||KIND.B;
        blocks.push({
          x: baseX+(c-(cols-1)/2)*BLOCK,
          y: baseY+rowFromBottom*BLOCK,
          vx:0,vy:0,w:0, ang:0, dens:k.dens, col:k.col, pts:k.pts,
          scored:false, half:BLOCK*0.46
        });
      }
    }
    initial=blocks.length;
    spawnBall();
  }
  function spawnBall(){
    ball={x:130,y:floorY+BALL_R+8,vx:0,vy:0,w:0,r:BALL_R, stuck:true};
    state="aim";
  }

  function launch(){
    if(!drag||!ball) return;
    const px=ball.homeX-drag.x, py=ball.homeY-drag.y;
    const len=Math.hypot(px,py);
    const power=Math.min(980, len*3.4);
    if(power<120){ message="Pull farther"; messageT=1; return; }
    ball.stuck=false;
    ball.x=drag.x; ball.y=drag.y;
    ball.vx=(px/len)*power; ball.vy=(py/len)*power;
    shots--; state="flying"; settle=0; message="IMPACT"; messageT=0.7;
    burst(ball.x,ball.y,[220,230,255],10);
    drag=null;
  }

  function burst(x,y,col,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=60+Math.random()*280;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.5,r:2+Math.random()*3,col});
    }
  }

  function step(dt){
    if(messageT>0) messageT-=dt;
    // particles
    particles=particles.filter(p=>{
      p.vy-=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; return p.life>0;
    });

    if(state!=="flying" && state!=="settled") return;

    // ball
    if(ball && !ball.stuck){
      ball.vy-=980*dt;
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      ball.w*=0.995;
      if(ball.y<floorY+ball.r){ ball.y=floorY+ball.r; ball.vy*=-0.35; ball.vx*=0.92; }
      if(ball.x<ball.r){ ball.x=ball.r; ball.vx=Math.abs(ball.vx)*0.7; }
      if(ball.x>W-ball.r){ ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx)*0.7; }
    }

    // blocks crude physics
    for(const b of blocks){
      b.vy-=980*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.ang+=b.w*dt;
      b.vx*=0.995; b.vy*=0.995; b.w*=0.99;
      if(b.y<floorY+b.half){
        b.y=floorY+b.half; b.vy*=-0.15; b.vx*=0.85; b.w*=0.7;
      }
      // ball collide
      if(ball && !ball.stuck){
        const dx=b.x-ball.x, dy=b.y-ball.y;
        const d=Math.hypot(dx,dy), minD=b.half+ball.r;
        if(d<minD && d>1e-3){
          const nx=dx/d, ny=dy/d, overlap=minD-d;
          const invB=1/b.dens, invBall=1/3.2, sum=invB+invBall;
          b.x+=nx*overlap*(invB/sum); b.y+=ny*overlap*(invB/sum);
          ball.x-=nx*overlap*(invBall/sum); ball.y-=ny*overlap*(invBall/sum);
          const rvx=b.vx-ball.vx, rvy=b.vy-ball.vy;
          const vn=rvx*nx+rvy*ny;
          if(vn<0){
            const j=-(1.15)*vn/sum;
            b.vx+=j*nx*invB; b.vy+=j*ny*invB;
            ball.vx-=j*nx*invBall; ball.vy-=j*ny*invBall;
            b.w+=(Math.random()-0.5)*4;
            burst(b.x,b.y,b.col,5);
          }
        }
      }
      // block-block soft separation
      for(const o of blocks){
        if(o===b) continue;
        const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy), minD=b.half+o.half;
        if(d<minD && d>1e-3){
          const nx=dx/d, ny=dy/d, push=(minD-d)*0.5;
          b.x-=nx*push; b.y-=ny*push; o.x+=nx*push; o.y+=ny*push;
        }
      }
      if(!b.scored){
        const fallen=b.y<floorY+BLOCK*0.25 || Math.abs(b.ang)>1.0 || b.x<40 || b.x>W-20;
        if(fallen){ b.scored=true; score+=b.pts; burst(b.x,b.y,b.col,8); }
      }
    }

    if(state==="flying"){
      const spd=ball?Math.hypot(ball.vx,ball.vy):0;
      if(spd<28) settle+=dt; else settle=0;
      if(settle>1.1 || (ball && ball.y<-80)){
        state="settled";
        const down=blocks.filter(b=>b.scored).length/Math.max(1,initial);
        if(down>=WIN){ state="won"; message=`Cleared ${(down*100)|0}%`; messageT=2.5; }
        else if(shots<=0){ state="lost"; message=`Only ${(down*100)|0}% down`; messageT=2.5; }
        else { spawnBall(); message=shots+" shots left"; messageT=1.3; }
      }
    }
  }

  function draw(){
    ctx.fillStyle="#161a22"; ctx.fillRect(0,0,W,H);
    // skyline
    ctx.fillStyle="#1e2430";
    for(let i=1;i<=12;i++){ const h=80+(i*37)%160; ctx.fillRect(i*90-40, floorY, 50, h); }
    ctx.fillStyle="rgba(255,200,90,0.15)";
    ctx.beginPath(); ctx.arc(W*0.82,H*0.78,60,0,Math.PI*2); ctx.fill();
    // ground
    ctx.fillStyle="#30343a"; ctx.fillRect(0,0,W,floorY);
    ctx.fillStyle="#464e46"; ctx.fillRect(0,floorY-8,W,10);
    ctx.strokeStyle="#5a645a"; ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(W,floorY); ctx.stroke();

    // sling posts
    ctx.strokeStyle="#5a4630"; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(95,floorY); ctx.lineTo(95,floorY+110); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(165,floorY); ctx.lineTo(165,floorY+110); ctx.stroke();
    ctx.fillStyle="#6e5532"; ctx.fillRect(85,floorY+100,90,14);

    // blocks
    for(const b of blocks){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.ang);
      ctx.fillStyle=`rgba(${b.col[0]},${b.col[1]},${b.col[2]},${b.scored?0.45:1})`;
      ctx.fillRect(-b.half,-b.half,b.half*2,b.half*2);
      ctx.restore();
    }

    // bands + ball
    let bx=ball?ball.x:130, by=ball?ball.y:floorY+BALL_R+8;
    if(state==="aim" && drag){ bx=drag.x; by=drag.y; }
    if(ball){
      ctx.strokeStyle="#b43c32"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(100,floorY+105); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160,floorY+105); ctx.lineTo(bx,by); ctx.stroke();
      if(drag){
        const px=ball.homeX-drag.x, py=ball.homeY-drag.y, len=Math.hypot(px,py)||1;
        const power=Math.min(980,len*3.4);
        ctx.strokeStyle="rgba(255,220,100,0.5)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+(px/len)*power*0.18, by+(py/len)*power*0.18); ctx.stroke();
      }
      ctx.fillStyle="#464e5a"; ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#a0aab8"; ctx.beginPath(); ctx.arc(bx-5,by+6,BALL_R*0.45,0,Math.PI*2); ctx.fill();
    }

    for(const p of particles){
      ctx.fillStyle=`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${Math.max(0,p.life)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }

    const down=blocks.filter(b=>b.scored).length/Math.max(1,initial);
    hud.innerHTML=`SCORE ${score}<br>SHOTS ${shots}<br>STAGE ${level+1}/${LEVELS.length}<br>DOWN ${(down*100)|0}%`;
    msgEl.textContent=messageT>0?message:(state==="won"?"STRUCTURE DOWN — tap NEXT":state==="lost"?"STILL STANDING — RESET":"");
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  function pos(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left, y:H-(t.clientY-r.top)}; // flip to Codea-like Y-up for logic? 
    // Actually canvas Y grows down — keep screen coords consistent with draw (y down).
  }
  // Use y-down throughout for browser:
  function pointer(e){
    const r=canvas.getBoundingClientRect();
    const t=e.changedTouches?e.changedTouches[0]: (e.touches?e.touches[0]:e);
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }

  // Redefine floor physics with y-down: floor is near bottom of screen
  // Rebuild start/spawn/step for y-down coordinates (simpler for canvas)
  function startYD(i){
    level=Math.max(0, Math.min(LEVELS.length-1, i));
    const L=LEVELS[level];
    shots=L.shots; score=0; state="aim"; message=L.name; messageT=2.2;
    blocks=[]; particles=[]; drag=null; settle=0;
    floorY=H-70;
    const map=L.map, rows=map.length, cols=map[0].length;
    const baseX=W*0.62;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const ch=map[r][c];
        if(ch==="."||ch===" ") continue;
        const k=KIND[ch]||KIND.B;
        const x=baseX+(c-(cols-1)/2)*BLOCK;
        const y=floorY - BLOCK*0.5 - 2 - (rows-1-r)*BLOCK;
        blocks.push({x,y,vx:0,vy:0,w:0,ang:0,dens:k.dens,col:k.col,pts:k.pts,scored:false,half:BLOCK*0.46});
      }
    }
    initial=blocks.length;
    ball={x:130,y:floorY-BALL_R-8,vx:0,vy:0,w:0,r:BALL_R,stuck:true,homeX:130,homeY:floorY-BALL_R-8};
    state="aim";
  }

  function stepYD(dt){
    if(messageT>0) messageT-=dt;
    particles=particles.filter(p=>{
      p.vy+=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; return p.life>0;
    });
    if(state!=="flying" && state!=="settled") return;
    if(ball && !ball.stuck){
      ball.vy+=980*dt;
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(ball.y>floorY-ball.r){ ball.y=floorY-ball.r; ball.vy*=-0.35; ball.vx*=0.92; }
      if(ball.x<ball.r){ ball.x=ball.r; ball.vx=Math.abs(ball.vx)*0.7; }
      if(ball.x>W-ball.r){ ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx)*0.7; }
    }
    for(const b of blocks){
      b.vy+=980*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.ang+=b.w*dt;
      b.vx*=0.995; b.vy*=0.995; b.w*=0.99;
      if(b.y>floorY-b.half){ b.y=floorY-b.half; b.vy*=-0.15; b.vx*=0.85; b.w*=0.7; }
      if(ball && !ball.stuck){
        const dx=b.x-ball.x, dy=b.y-ball.y, d=Math.hypot(dx,dy), minD=b.half+ball.r;
        if(d<minD && d>1e-3){
          const nx=dx/d, ny=dy/d, overlap=minD-d;
          const invB=1/b.dens, invBall=1/3.2, sum=invB+invBall;
          b.x+=nx*overlap*(invB/sum); b.y+=ny*overlap*(invB/sum);
          ball.x-=nx*overlap*(invBall/sum); ball.y-=ny*overlap*(invBall/sum);
          const vn=(b.vx-ball.vx)*nx+(b.vy-ball.vy)*ny;
          if(vn<0){
            const j=-(1.15)*vn/sum;
            b.vx+=j*nx*invB; b.vy+=j*ny*invB;
            ball.vx-=j*nx*invBall; ball.vy-=j*ny*invBall;
            burst(b.x,b.y,b.col,5);
          }
        }
      }
      for(const o of blocks){
        if(o===b) continue;
        const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy), minD=b.half+o.half;
        if(d<minD && d>1e-3){
          const nx=dx/d, ny=dy/d, push=(minD-d)*0.5;
          b.x-=nx*push; b.y-=ny*push; o.x+=nx*push; o.y+=ny*push;
        }
      }
      if(!b.scored){
        const fallen=b.y>floorY-BLOCK*0.25 || Math.abs(b.ang)>1.0 || b.x<40 || b.x>W-20;
        if(fallen){ b.scored=true; score+=b.pts; burst(b.x,b.y,b.col,8); }
      }
    }
    if(state==="flying"){
      const spd=ball?Math.hypot(ball.vx,ball.vy):0;
      if(spd<28) settle+=dt; else settle=0;
      if(settle>1.1 || (ball && ball.y>H+80)){
        state="settled";
        const down=blocks.filter(b=>b.scored).length/Math.max(1,initial);
        if(down>=WIN){ state="won"; message=`Cleared ${(down*100)|0}%`; messageT=2.5; }
        else if(shots<=0){ state="lost"; message=`Only ${(down*100)|0}% down`; messageT=2.5; }
        else {
          ball={x:130,y:floorY-BALL_R-8,vx:0,vy:0,w:0,r:BALL_R,stuck:true,homeX:130,homeY:floorY-BALL_R-8};
          state="aim"; message=shots+" shots left"; messageT=1.3;
        }
      }
    }
  }

  function drawYD(){
    ctx.fillStyle="#161a22"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#1e2430";
    for(let i=1;i<=12;i++){ const h=80+(i*37)%160; ctx.fillRect(i*90-40, floorY-h, 50, h); }
    ctx.fillStyle="rgba(255,200,90,0.15)";
    ctx.beginPath(); ctx.arc(W*0.82, H*0.22, 60, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#30343a"; ctx.fillRect(0,floorY,W,H-floorY);
    ctx.fillStyle="#464e46"; ctx.fillRect(0,floorY,W,10);
    // posts
    ctx.strokeStyle="#5a4630"; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(95,floorY); ctx.lineTo(95,floorY-110); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(165,floorY); ctx.lineTo(165,floorY-110); ctx.stroke();
    ctx.fillStyle="#6e5532"; ctx.fillRect(85,floorY-114,90,14);
    for(const b of blocks){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.ang);
      ctx.fillStyle=`rgba(${b.col[0]},${b.col[1]},${b.col[2]},${b.scored?0.45:1})`;
      ctx.fillRect(-b.half,-b.half,b.half*2,b.half*2);
      ctx.restore();
    }
    let bx=ball?ball.x:130, by=ball?ball.y:floorY-BALL_R-8;
    if(state==="aim" && drag){ bx=drag.x; by=drag.y; }
    if(ball){
      ctx.strokeStyle="#b43c32"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(100,floorY-105); ctx.lineTo(bx,by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160,floorY-105); ctx.lineTo(bx,by); ctx.stroke();
      if(drag){
        const px=ball.homeX-drag.x, py=ball.homeY-drag.y, len=Math.hypot(px,py)||1;
        const power=Math.min(980,len*3.4);
        ctx.strokeStyle="rgba(255,220,100,0.5)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+(px/len)*power*0.18, by+(py/len)*power*0.18); ctx.stroke();
      }
      ctx.fillStyle="#464e5a"; ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#c8d0dc"; ctx.beginPath(); ctx.arc(bx-5,by-6,BALL_R*0.4,0,Math.PI*2); ctx.fill();
    }
    for(const p of particles){
      ctx.fillStyle=`rgba(${p.col[0]},${p.col[1]},${p.col[2]},${Math.max(0,p.life)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    if(state==="won"||state==="lost"){
      ctx.fillStyle="rgba(8,10,16,0.75)";
      ctx.fillRect(W/2-240, H/2-70, 480, 140);
      ctx.fillStyle="#ffd26e"; ctx.font="bold 34px sans-serif"; ctx.textAlign="center";
      ctx.fillText(state==="won"?"STRUCTURE DOWN":"STILL STANDING", W/2, H/2+8);
      ctx.fillStyle="#b4c8dc"; ctx.font="16px sans-serif";
      ctx.fillText(state==="won"?"Tap NEXT for next demolition":"Tap RESET to retry", W/2, H/2+40);
    }
    const down=blocks.filter(b=>b.scored).length/Math.max(1,initial);
    hud.innerHTML=`SCORE ${score}<br>SHOTS ${shots}<br>STAGE ${level+1}/${LEVELS.length} · need 62%<br>DOWN ${(down*100)|0}%`;
    msgEl.textContent=messageT>0?message:"";
  }

  // Replace loop with y-down versions
  function frame2(now){
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    stepYD(dt); drawYD();
    requestAnimationFrame(frame2);
  }

  canvas.addEventListener("pointerdown", e=>{
    const p=pointer(e);
    if(state==="aim" && ball && Math.hypot(p.x-ball.x,p.y-ball.y)<90){
      drag={x:p.x,y:p.y}; canvas.setPointerCapture(e.pointerId);
    }
  });
  canvas.addEventListener("pointermove", e=>{ if(drag) drag={x:pointer(e).x,y:pointer(e).y}; });
  canvas.addEventListener("pointerup", e=>{
    if(drag){
      const p=pointer(e); drag={x:p.x,y:p.y};
      const px=ball.homeX-drag.x, py=ball.homeY-drag.y;
      const len=Math.hypot(px,py);
      const power=Math.min(980,len*3.4);
      if(power<120){ message="Pull farther"; messageT=1; drag=null; return; }
      ball.stuck=false; ball.x=drag.x; ball.y=drag.y;
      ball.vx=(px/len)*power; ball.vy=(py/len)*power;
      shots--; state="flying"; settle=0; message="IMPACT"; messageT=0.7;
      burst(ball.x,ball.y,[220,230,255],10); drag=null;
    }
  });
  document.getElementById("reset").onclick=()=>startYD(level);
  document.getElementById("next").onclick=()=>startYD((level+1)%LEVELS.length);

  resize();
  startYD(0);
  requestAnimationFrame(frame2);
